server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall through to index.html rather than 404,
    # so a deep link or a refresh lands in the app instead of on an error page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the one file that must never be cached: it names the hashed
    # bundles, and a browser holding yesterday's copy asks for bundles that no
    # longer exist after a rebuild — a blank page with 404s in the console.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed assets are immutable by construction — a content change produces a
    # new filename, so caching them for a year is safe and removes almost all
    # repeat-visit traffic.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The exported dataset is NOT hashed and is replaced in place by a re-export,
    # so it must revalidate. Caching it like an asset would serve stale scores
    # after every recompute.
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
